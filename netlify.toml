# Netlify config — app Next.js nằm trong thư mục web/
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=6144"
  # URL công khai của site — NextAuth dùng để dựng callback/redirect. Đặt cố định ở đây cho chắc.
  NEXTAUTH_URL = "https://gohub-intel.netlify.app"
  # Tat secret scanner: NEXT_PUBLIC_* bi nhung vao client bundle theo thiet ke (anon key la public);
  # secret that nam trong env vars (khong commit, da gitignore). Day la false-positive.
  SECRETS_SCAN_ENABLED = "false"

# Runtime chính thức cho Next.js (App Router, SSR, API routes, middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"
