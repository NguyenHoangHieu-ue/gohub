name: Sync GoHub Data to Supabase

on:
  schedule:
    - cron: "0 1 * * *"   # every day at 01:00 UTC
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run sync
        working-directory: ./backend/data_sync
        run: python sync.py
        env:
          API_KEY:              ${{ secrets.API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Notify Lark
        if: always()
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://gohub-intel.vercel.app/api/notify/lark \
            -H "Authorization: Bearer ${{ secrets.MCP_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Lark notify status: $STATUS"
        continue-on-error: true
