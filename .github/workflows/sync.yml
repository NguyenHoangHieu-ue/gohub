name: Sync GoHub Data to Supabase

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 ICT (sau khi GoHub API cập nhật data buổi sáng)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # s198+11 (2026-09-15): 20' (thêm s159 2026-08-09, defensive chung cho 4 workflow) quá ngắn — lịch sử
    # lúc còn chạy thành công (trước 2026-07-21) từng mất tới 59'. Repo public = Actions minutes miễn phí
    # không giới hạn, không có lý do giữ cap thấp làm sync bị "cancelled" giữa chừng.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run sync
        working-directory: ./backend/data_sync
        run: python sync.py
        env:
          API_KEY:              ${{ secrets.API_KEY }}
          SUPABASE_URL:         ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Notify Lark
        if: always()
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://gohub-intel.vercel.app/api/notify/lark \
            -H "Authorization: Bearer ${{ secrets.MCP_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Lark notify status: $STATUS"
        continue-on-error: true
