name: Sync GoHub Data to Supabase

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 ICT hằng ngày: chỉ job `core` (products/skus/listings, ~8')
    - cron: "0 2 * * 0"   # 02:00 UTC Chủ nhật hằng tuần: job `items` (233k dòng, ~100')
  workflow_dispatch:      # chạy tay: cả `core` lẫn `items` (trừ khi bật dump_skus_only)
    inputs:
      dump_skus_only:
        description: "DEBUG tạm: chỉ dump raw response GET /skus, không chạy sync thật (xoá job này sau khi dùng)"
        required: false
        default: false
        type: boolean
      dump_sku_code:
        description: "DEBUG tạm: lọc theo skuCode cụ thể (bỏ trống = lấy trang đầu)"
        required: false
        default: ""
        type: string

# s201 (2026-09-19): tách 2 job. Trước đây 1 job tải cả 4 bảng rồi mới ghi → items (233k dòng, server cắt
# 200 dòng/trang, ~82 phút tuần tự) làm cả job vượt timeout 90' và KHÔNG ghi gì → Supabase đóng băng từ
# 2026-07-20. Nay: `core` (products/skus/listings, vài phút) ghi ngay; `items` chạy sau, timeout riêng,
# lỗi/timeout của items không ảnh hưởng dữ liệu core đã ghi.
# Items (233k dòng) tải ~100' (server cắt 200 dòng/trang, không nhanh hơn khi thêm luồng) và Catalogue KHÔNG dùng
# bảng này (chỉ products/skus/listings) — items chỉ phục vụ tab Item ở /skus + Bé Gấu tra giá bán/alias — nên
# chỉ đồng bộ mỗi tuần 1 lần hoặc khi chạy tay.
jobs:
  dump_skus:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dump_skus_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - working-directory: ./backend/data_sync
        run: python -u debug_dump_skus.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DEBUG_SKU_CODE: ${{ inputs.dump_sku_code }}

  core:
    runs-on: ubuntu-latest
    if: ${{ !inputs.dump_skus_only && (github.event_name != 'schedule' || github.event.schedule == '0 1 * * *') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run sync (products, skus, listings)
        working-directory: ./backend/data_sync
        run: python -u sync.py core
        env:
          API_KEY:              ${{ secrets.API_KEY }}
          SUPABASE_URL:         ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Notify Lark
        if: always()
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://gohub-intel.vercel.app/api/notify/lark \
            -H "Authorization: Bearer ${{ secrets.MCP_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Lark notify status: $STATUS"
        continue-on-error: true

  items:
    runs-on: ubuntu-latest
    needs: core
    # Chủ nhật 02:00 UTC (core bị bỏ qua) hoặc chạy tay (sau core, dù core lỗi — items độc lập; FK thiếu sẽ báo rõ)
    if: ${{ always() && !inputs.dump_skus_only && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 0') }}
    timeout-minutes: 150     # repo public = Actions minutes miễn phí; 233k dòng ≈ 25–40' với tải song song
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run sync (items)
        working-directory: ./backend/data_sync
        run: python -u sync.py items
        env:
          API_KEY:              ${{ secrets.API_KEY }}
          SUPABASE_URL:         ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
