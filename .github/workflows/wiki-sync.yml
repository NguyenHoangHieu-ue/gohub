name: Wiki Sync — docs/wiki → Supabase

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
  workflow_dispatch:  # cho phép trigger thủ công từ GitHub Actions UI để test
    inputs:
      dry_run:
        description: "Chỉ in kế hoạch, KHÔNG ghi Supabase"
        type: boolean
        default: true

jobs:
  sync:
    name: Sync wiki pages to Supabase
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml requests

      - name: Sync wiki to Supabase
        # Script cũ backend/seeding/import/import_wiki.py chưa từng được commit (.gitignore bỏ backend/) → 40/40 lần lỗi. Viết lại s223.
        run: python .github/scripts/wiki_sync.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
