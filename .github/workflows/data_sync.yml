name: Sync Data Files to Supabase

on:
  # Chạy khi có file xlsx thay đổi trong resources/reference/ (push to main)
  push:
    branches: [main]
    paths:
      - "resources/reference/**/*.xlsx"

  # Chạy thủ công từ GitHub Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-import tất cả file (bỏ qua hash check)"
        required: false
        default: "false"

  # Không có schedule hàng ngày — chỉ chạy khi file thực sự thay đổi
  # (schedule không bị filter bởi paths: → sẽ chạy mọi ngày dù không có gì đổi)

jobs:
  sync-data-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase openpyxl

      - name: Run data file sync
        env:
          SUPABASE_URL:         ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python backend/data_sync/sync_data_files.py $ARGS

      - name: Run geo hierarchy population (only on force)
        if: ${{ github.event.inputs.force == 'true' }}
        env:
          SUPABASE_URL:         ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python backend/data_sync/populate_geo_hierarchy.py
