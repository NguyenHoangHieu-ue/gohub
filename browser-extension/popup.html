<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: -apple-system, Segoe UI, sans-serif; padding: 14px; font-size: 13px; color: #1e293b; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; font-weight: 600; margin-bottom: 3px; margin-top: 10px; font-size: 11px; color: #64748b; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    button { padding: 7px 12px; border: none; border-radius: 8px; background: #7c3aed; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
    button:hover { background: #6d28d9; }
    .status { margin-top: 10px; font-size: 11px; padding: 6px 8px; border-radius: 8px; }
    .on { background: #d1fae5; color: #047857; }
    .off { background: #f1f5f9; color: #64748b; }
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #cbd5e1; border-radius: 20px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: #7c3aed; }
    input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h1>🐻 GoHub Gấu Pro Bridge</h1>

  <label>Server URL</label>
  <input type="text" id="serverUrl" placeholder="https://stg-intel-v2.gohub.cloud">

  <label>Token (lấy ở trang Bridge → Creator)</label>
  <input type="password" id="token" placeholder="dán token...">

  <div class="row">
    <span>Bridge</span>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <button id="save">Lưu</button>
    <span id="statusText" class="status off">Đang tắt</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
